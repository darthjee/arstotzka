plugins:
  - rubocop-rspec
  - rubocop-rake
inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable

Layout/LineLength:
  Max: 100

Style/ClassAndModuleChildren:
  Exclude:
    - spec/integration/**/*.rb

Style/ClassVars:
  Exclude:
    - spec/support/models/arstotzka/fetcher/class_variable.rb

Layout/HashAlignment:
  EnforcedColonStyle: table

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*_spec.rb'
    - 'spec/support/**/*.rb'
    - '*.gemspec'

Style/HashEachMethods:
  Enabled: true

Style/HashTransformKeys:
  Enabled: true

Style/HashTransformValues:
  Enabled: true

RSpec/MultipleMemoizedHelpers:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

Style/OpenStructUse:
  Exclude:
    - 'spec/**/*.rb'
